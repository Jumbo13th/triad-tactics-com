---
- name: Deploy the tested Triad release with a verified backup and rollback
  hosts: triad
  become: true
  gather_facts: false
  vars:
    site: /opt/triad-tactics
    source: "{{ playbook_dir }}/../.."
    revision: "{{ lookup('ansible.builtin.env', 'REVISION') }}"
    digest: "{{ lookup('ansible.builtin.env', 'IMAGE_DIGEST') }}"
    image: "ghcr.io/jumbo13th/triad-tactics-com@{{ digest }}"
    release: "{{ site }}/.deploy/releases/{{ revision }}-{{ digest[7:19] }}"
    compose: "{{ lookup('ansible.builtin.file', source + '/docker-compose.yml') | from_yaml }}"
    metadata:
      x-triad-revision: "{{ revision }}"
      services:
        app: {image: "{{ image }}"}
        nginx: {image: "{{ compose.services.nginx.image }}"}
        cron: {image: "{{ image }}"}
      volumes:
        db: {external: true, name: triad-tactics_db}
  module_defaults:
    community.docker.docker_compose_v2:
      project_name: triad-tactics
      env_files: ["/opt/triad-tactics/.env"]
      files: [docker-compose.yml, image.override.json]
      build: never
      pull: never
      dependencies: false
      wait: true
      wait_timeout: 120
  tasks:
    - name: Validate the immutable release identifiers
      ansible.builtin.assert:
        that:
          - revision is match('^[0-9a-f]{40}\\Z')
          - digest is match('^sha256:[0-9a-f]{64}\\Z')

    - name: Read the managed current and previous release pointers
      ansible.builtin.stat:
        path: "{{ site }}/.deploy/{{ item }}"
        follow: false
      loop: [current, previous]
      register: pointers

    - name: Require the one-time adoption of the existing installation
      ansible.builtin.assert:
        that:
          - pointers.results[0].stat.islnk | default(false)
          - pointers.results[0].stat.lnk_source is match('^/opt/triad-tactics/\\.deploy/releases/[a-zA-Z0-9_-]+$')
          - not pointers.results[1].stat.exists or pointers.results[1].stat.islnk | default(false)
        fail_msg: Run the reviewed bootstrap workflow before deploying.

    - name: Read the current release's pinned images and revision
      ansible.builtin.slurp:
        src: "{{ pointers.results[0].stat.lnk_source }}/image.override.json"
      register: previous_file

    - name: Remember the known-good release
      ansible.builtin.set_fact:
        previous_release: "{{ pointers.results[0].stat.lnk_source }}"
        previous_metadata: "{{ previous_file.content | b64decode | from_json }}"

    - name: Require separate review for database implementation changes
      ansible.builtin.command:
        argv: [git, -C, "{{ source }}", diff, --name-only, "{{ previous_metadata['x-triad-revision'] }}", "{{ revision }}", --, src/platform/db]
      delegate_to: localhost
      become: false
      register: database_changes
      changed_when: false
      failed_when: database_changes.rc != 0 or database_changes.stdout | length > 0

    - name: Back up and deploy while scheduled backups are paused
      block:
        - name: Pause the backup timer
          ansible.builtin.systemd_service:
            name: triad-backup.timer
            state: stopped

        - name: Wait up to five minutes for an existing backup to finish
          ansible.builtin.command:
            argv: [systemctl, show, triad-backup.service, --property=ActiveState, --value]
          register: maintenance
          until: maintenance.stdout in ['inactive', 'failed']
          retries: 30
          delay: 10
          changed_when: false

        - name: Create and verify the backup under its systemd time limit
          ansible.builtin.command:
            argv: [systemctl, start, --wait, triad-backup.service]
          changed_when: true

        - name: Prepare the immutable release directory
          ansible.builtin.file:
            path: "{{ release }}/nginx"
            state: directory
            mode: '0700'

        - name: Copy the tested Compose and nginx configuration
          ansible.builtin.copy:
            src: "{{ source }}/{{ item }}"
            dest: "{{ release }}/{{ item }}"
            mode: '0600'
          loop: [docker-compose.yml, nginx/default.conf]

        - name: Record the pinned images and existing production volume
          ansible.builtin.copy:
            content: "{{ metadata | to_nice_json }}\n"
            dest: "{{ release }}/image.override.json"
            mode: '0600'

        - name: Create temporary registry credential storage
          ansible.builtin.tempfile:
            state: directory
            prefix: triad-registry-
          register: registry

        - name: Authenticate the short-lived GitHub registry token
          community.docker.docker_login:
            registry_url: ghcr.io
            username: "{{ lookup('ansible.builtin.env', 'REGISTRY_USERNAME') }}"
            password: "{{ lookup('ansible.builtin.env', 'REGISTRY_TOKEN') }}"
            config_path: "{{ registry.path }}/config.json"
          no_log: true

        - name: Pull the tested images without building on the VPS
          community.docker.docker_compose_v2_pull:
            project_src: "{{ release }}"
            project_name: triad-tactics
            env_files: ["{{ site }}/.env"]
            files: [docker-compose.yml, image.override.json]
          environment:
            DOCKER_CONFIG: "{{ registry.path }}"
          no_log: true

        - name: Roll out the release or restore the previous configuration
          block:
            - name: Pause application cron during cutover
              community.docker.docker_compose_v2:
                project_src: "{{ previous_release }}"
                services: [cron]
                state: stopped
              no_log: true

            - name: Start the application and proxy and wait for health checks
              community.docker.docker_compose_v2:
                project_src: "{{ release }}"
                services: [app, nginx]
                state: present
              no_log: true

            - name: Check production from outside the VPS
              ansible.builtin.uri:
                url: "https://triad-tactics.com{{ item }}"
                status_code: 200
                timeout: 20
              loop: [/en, /ru, /api/games/current, /api/units]
              delegate_to: localhost
              become: false
              register: health
              until: health.status | default(0) == 200
              retries: 6
              delay: 5

            - name: Resume application cron
              community.docker.docker_compose_v2:
                project_src: "{{ release }}"
                services: [cron]
                state: present
              no_log: true

            - name: Protect the previous images from pruning
              community.docker.docker_container:
                name: "triad-tactics-rollback-{{ item.key }}"
                image: "{{ item.value.image }}"
                state: present
                recreate: true
                entrypoint: /bin/true
                labels: {io.triad.rollback: 'true'}
              loop: "{{ previous_metadata.services | dict2items }}"
              when: previous_release != release

            - name: Commit the healthy release pointers
              ansible.builtin.file:
                src: "{{ item.src }}"
                dest: "{{ site }}/.deploy/{{ item.name }}"
                state: link
                force: true
              loop:
                - {name: previous, src: "{{ previous_release }}"}
                - {name: current, src: "{{ release }}"}
              when: previous_release != release
          rescue:
            - name: Restore the previous Compose release without changing database contents
              community.docker.docker_compose_v2:
                project_src: "{{ previous_release }}"
                services: [app, nginx, cron]
                state: present
              no_log: true

            - name: Restore the previous release pointers after any partial commit
              ansible.builtin.file:
                src: "{{ item.stat.lnk_source }}"
                dest: "{{ site }}/.deploy/{{ item.item }}"
                state: link
                force: true
              loop: "{{ pointers.results }}"
              when: item.stat.exists

            - name: Remove a previous pointer created by an unsuccessful first deployment
              ansible.builtin.file:
                path: "{{ site }}/.deploy/previous"
                state: absent
              when: not pointers.results[1].stat.exists

            - name: Read the originally retained previous images
              ansible.builtin.slurp:
                src: "{{ pointers.results[1].stat.lnk_source }}/image.override.json"
              register: retained
              when: pointers.results[1].stat.exists

            - name: Restore previous image protection after a partial holder update
              community.docker.docker_container:
                name: "triad-tactics-rollback-{{ item.key }}"
                image: "{{ item.value.image }}"
                state: present
                recreate: true
                entrypoint: /bin/true
                labels: {io.triad.rollback: 'true'}
              loop: "{{ (retained.content | default('e30=') | b64decode | from_json).get('services', {}) | dict2items }}"
              when: pointers.results[1].stat.exists

            - name: Verify the restored site from outside the VPS
              ansible.builtin.uri:
                url: https://triad-tactics.com/en
                status_code: 200
                timeout: 20
              delegate_to: localhost
              become: false
              register: restored
              until: restored.status | default(0) == 200
              retries: 6
              delay: 5

            - name: Report the unsuccessful deployment
              ansible.builtin.fail:
                msg: Deployment failed; the previous Compose release was restored and the database was preserved.
      always:
        - name: Remove the temporary registry credentials
          ansible.builtin.file:
            path: "{{ registry.path }}"
            state: absent
          when: registry is defined and registry.path is defined
          no_log: true

        - name: Resume scheduled backups
          ansible.builtin.systemd_service:
            name: triad-backup.timer
            state: started
            enabled: true
