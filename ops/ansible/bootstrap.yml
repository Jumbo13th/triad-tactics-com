---
# One-time adoption keeps the existing Compose stack and database in place.
- name: Adopt the existing Triad installation and enable verified restic backups
  hosts: triad
  become: true
  gather_facts: false
  vars:
    site: /opt/triad-tactics
    source: "{{ playbook_dir }}/../.."
    password: "{{ lookup('ansible.builtin.env', 'BACKUP_ENCRYPTION_PASSPHRASE') }}"
  tasks:
    - name: Require the GitHub-held recovery password
      ansible.builtin.assert:
        that:
          - password | length >= 32
          - "'\n' not in password and '\r' not in password"
      no_log: true

    - name: Install standard host dependencies
      ansible.builtin.apt:
        name: [python3, python3-requests, sqlite3, jq, curl, bzip2, util-linux, ca-certificates]
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create private operational directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0700'
      loop:
        - /etc/triad-backup
        - /usr/local/lib/triad-backup
        - /var/lib/triad-backup
        - "{{ site }}/backups"
        - "{{ site }}/.deploy/releases"

    - name: Install the recovery password without replacing an existing key
      ansible.builtin.copy:
        content: "{{ password }}\n"
        dest: /etc/triad-backup/restic-password
        mode: '0600'
        force: false
      no_log: true

    - name: Verify an existing repository still uses the GitHub-held password
      ansible.builtin.slurp:
        src: /etc/triad-backup/restic-password
      register: installed_password
      no_log: true

    - name: Refuse accidental replacement of the recovery password
      ansible.builtin.assert:
        that: installed_password.content | b64decode == password ~ '\n'
      no_log: true

    - name: Check whether this installation has already been adopted
      ansible.builtin.stat:
        path: "{{ site }}/.deploy/current"
        follow: false
      register: managed

    - name: Record the current release once without restarting production
      when: not managed.stat.exists
      block:
        - name: Inspect the running Compose services
          community.docker.docker_host_info:
            containers: true
            containers_filters:
              label: com.docker.compose.project=triad-tactics
              status: running
          register: running

        - name: Record actual image IDs and application configuration
          ansible.builtin.set_fact:
            images: "{{ images | default({}) | combine({item.Labels['com.docker.compose.service']: {'image': item.ImageID}}) }}"
            active: "{{ item if item.Labels['com.docker.compose.service'] == 'app' else active | default({}) }}"
          loop: "{{ running.containers }}"

        - name: Identify the existing source revision and configuration
          ansible.builtin.set_fact:
            adopted_revision: >-
              {{ active.Labels['org.opencontainers.image.revision'] |
                 default(lookup('ansible.builtin.env', 'ADOPT_REVISION'), true) }}
            active_directory: "{{ active.Labels['com.docker.compose.project.working_dir'] }}"

        - name: Require an explicitly verified revision and the existing database volume
          ansible.builtin.assert:
            that:
              - running.containers | length == 3 and images.keys() | sort == ['app', 'cron', 'nginx']
              - adopted_revision is match('^[0-9a-f]{40}\\Z')
              - active_directory == site or active_directory is match('^/opt/triad-tactics/\\.deploy/releases/[a-zA-Z0-9_-]+$')
              - active.Mounts | selectattr('Destination', 'equalto', '/app/database') | map(attribute='Name') | list == ['triad-tactics_db']
            fail_msg: Verify the current image/source and supply ADOPT_REVISION if its OCI revision label is missing.

        - name: Prepare the adopted release directory
          ansible.builtin.file:
            path: "{{ site }}/.deploy/releases/adopted-{{ adopted_revision }}/nginx"
            state: directory
            mode: '0700'

        - name: Preserve the existing Compose and nginx configuration
          ansible.builtin.copy:
            src: "{{ active_directory }}/{{ item }}"
            dest: "{{ site }}/.deploy/releases/adopted-{{ adopted_revision }}/{{ item }}"
            remote_src: true
            mode: '0600'
          loop: [docker-compose.yml, nginx/default.conf]

        - name: Record current images, revision, and external database volume
          ansible.builtin.copy:
            content: >-
              {{ {'x-triad-revision': adopted_revision, 'services': images,
                  'volumes': {'db': {'external': true, 'name': 'triad-tactics_db'}}} | to_nice_json }}
            dest: "{{ site }}/.deploy/releases/adopted-{{ adopted_revision }}/image.override.json"
            mode: '0600'

        - name: Mark the adopted configuration as current
          ansible.builtin.file:
            src: "{{ site }}/.deploy/releases/adopted-{{ adopted_revision }}"
            dest: "{{ site }}/.deploy/current"
            state: link

    - name: Check for an existing restic backup schedule
      ansible.builtin.stat:
        path: /etc/systemd/system/triad-backup.timer
      register: restic_timer

    - name: Remember whether the existing restic timer is running
      ansible.builtin.command:
        argv: [systemctl, show, triad-backup.timer, --property=ActiveState, --value]
      register: prior_timer
      changed_when: false
      when: restic_timer.stat.exists

    - name: Install or update backups without leaving an existing schedule disabled
      block:
        - name: Pause an existing restic timer during its update
          ansible.builtin.systemd_service:
            name: triad-backup.timer
            state: stopped
          when: restic_timer.stat.exists

        - name: Wait up to five minutes for a running restic backup to finish
          ansible.builtin.command:
            argv: [systemctl, show, triad-backup.service, --property=ActiveState, --value]
          register: backup_state
          until: backup_state.stdout in ['inactive', 'failed']
          retries: 30
          delay: 10
          changed_when: false
          when: restic_timer.stat.exists

        - name: Install upstream restic and the SQLite backup hook
          ansible.builtin.copy:
            src: "{{ source }}/{{ item.src }}"
            dest: "{{ item.dest }}"
            mode: "{{ item.mode }}"
          loop:
            - {src: ops/setup-restic.sh, dest: /usr/local/lib/triad-backup/setup-restic.sh, mode: '0700'}
            - {src: ops/backup/triad-backup.sh, dest: /usr/local/sbin/triad-backup, mode: '0700'}
            - {src: ops/backup/triad-backup.service, dest: /etc/systemd/system/triad-backup.service, mode: '0644'}
            - {src: ops/backup/triad-backup.timer, dest: /etc/systemd/system/triad-backup.timer, mode: '0644'}

        - name: Install the verified upstream restic release
          ansible.builtin.command:
            argv: [bash, /usr/local/lib/triad-backup/setup-restic.sh]
          register: restic_install
          changed_when: restic_install.stdout | length > 0

        - name: Reload the backup unit
          ansible.builtin.systemd_service:
            daemon_reload: true

        - name: Verify the new backup before replacing the existing schedule
          ansible.builtin.command:
            argv: [systemctl, start, --wait, triad-backup.service]
          changed_when: true

        - name: Enable verified daily backups
          ansible.builtin.systemd_service:
            name: triad-backup.timer
            state: started
            enabled: true

        - name: Find the old backup schedule
          ansible.builtin.stat:
            path: /etc/systemd/system/triad-maintenance.timer
          register: legacy_timer

        - name: Retire the old schedule after its replacement is working
          ansible.builtin.systemd_service:
            name: triad-maintenance.timer
            state: stopped
            enabled: false
          when: legacy_timer.stat.exists
      always:
        - name: Resume an existing active schedule even if its update failed
          ansible.builtin.systemd_service:
            name: triad-backup.timer
            state: started
          when: prior_timer.stdout | default('') == 'active'
