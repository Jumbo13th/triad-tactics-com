services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      # REQUIRED in production
      STEAM_WEB_API_KEY: ${STEAM_WEB_API_KEY}
      ADMIN_STEAM_IDS: ${ADMIN_STEAM_IDS}
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY}
      OUTBOX_CRON_SECRET: ${OUTBOX_CRON_SECRET}
      GAMESERVER_API_SECRET: ${GAMESERVER_API_SECRET}

      # Optional behavior toggles
      DISABLE_RATE_LIMITS: ${DISABLE_RATE_LIMITS:-false}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-120}

      # Optional Discord integration
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI}
      DISCORD_REDIRECT_URI_LOCAL: ${DISCORD_REDIRECT_URI_LOCAL}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID}
      DISCORD_CONFIRMED_ROLE_ID: ${DISCORD_CONFIRMED_ROLE_ID}
      DISCORD_TOKEN_ENCRYPTION_KEY: ${DISCORD_TOKEN_ENCRYPTION_KEY}

      # Optional Brevo email notifications
      BREVO_API_KEY: ${BREVO_API_KEY}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME}
      BREVO_REPLY_TO_EMAIL: ${BREVO_REPLY_TO_EMAIL}
    volumes:
      - db:/app/database
    restart: unless-stopped

  cron:
    image: alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
    depends_on:
      - app
    environment:
      OUTBOX_CRON_SECRET: ${OUTBOX_CRON_SECRET}
      CRON_INTERVAL_SECONDS: ${CRON_INTERVAL_SECONDS:-60}
    command:
      - /bin/sh
      - -c
      - |
        apk add --no-cache curl;
        while true; do
          curl -fsS -H "Authorization: Bearer $${OUTBOX_CRON_SECRET}" http://app:3000/api/cron >/dev/null || true;
          sleep "$${CRON_INTERVAL_SECONDS}";
        done
    restart: unless-stopped

  nginx:
    # The slim image contains the proxy/TLS modules we use without optional modules.
    image: nginx:1.30.6-alpine-slim@sha256:dede8895648b461178c3bc604f7eed4423efe5220b2c4d839f5eb3d34ac3f8f7
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Let's Encrypt certs (managed by certbot on the host).
      # Mount the whole /etc/letsencrypt dir: live/ contains symlinks into archive/.
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # ACME http-01 challenge webroot (certbot writes, nginx serves)
      - /var/www/certbot:/var/www/certbot:ro
    restart: unless-stopped

volumes:
  db:
