version: 2
updates:
- package-ecosystem: "npm"
  directory: "/"
  schedule:
    interval: "weekly"
  open-pull-requests-limit: 12
  groups:
    next:
      patterns:
      - "next"
      - "eslint-config-next"
    react:
      patterns:
      - "react"
      - "react-dom"
      - "@types/react"
      - "@types/react-dom"
    framework-security:
      applies-to: security-updates
      patterns:
      - "next"
      - "eslint-config-next"
      - "react"
      - "react-dom"
      - "@types/react"
      - "@types/react-dom"

- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "weekly"
  open-pull-requests-limit: 12

- package-ecosystem: "docker"
  directory: "/"
  schedule:
    interval: "weekly"
  open-pull-requests-limit: 12

- package-ecosystem: "docker-compose"
  directory: "/"
  schedule:
    interval: "weekly"
  open-pull-requests-limit: 12
