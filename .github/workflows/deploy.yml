name: Deploy production

on:
  workflow_call:
    inputs:
      revision:
        description: Commit that passed this CI run
        type: string
        required: true
      image_digest:
        description: Immutable digest of the image tested and published by CI
        type: string
        required: true

permissions:
  contents: read
  packages: read

concurrency:
  group: production-operations
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    if: github.repository == 'Jumbo13th/triad-tactics-com' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    steps:
    - name: Checkout tested revision
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        ref: ${{ inputs.revision }}
        persist-credentials: false
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.13'
        cache: pip
        cache-dependency-path: ops/requirements.txt

    - name: Install Ansible
      run: |
        python -m pip install -r ops/requirements.txt
        ansible-galaxy collection install -r ops/ansible/requirements.yml

    - name: Set up production SSH
      uses: ./.github/actions/setup-vps-ssh
      with:
        host: ${{ vars.DEPLOY_HOST }}
        private-key: ${{ secrets.DEPLOY_SSH_KEY }}
        known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

    - name: Back up, deploy the tested image, and check production
      env:
        REVISION: ${{ inputs.revision }}
        IMAGE_DIGEST: ${{ inputs.image_digest }}
        REGISTRY_USERNAME: ${{ github.actor }}
        REGISTRY_TOKEN: ${{ github.token }}
      run: ansible-playbook -i ops/ansible/inventory.yml ops/ansible/deploy.yml

    - name: Check the public site from outside the VPS
      run: |
        for path in /en /ru /api/games/current /api/units; do
          curl --fail --silent --show-error --retry 3 --retry-delay 2 --max-time 20 \
            --output /dev/null --write-out "$path HTTP %{http_code}\n" "https://triad-tactics.com$path"
        done
        echo 'Deployment and external HTTPS checks passed.' >> "$GITHUB_STEP_SUMMARY"
