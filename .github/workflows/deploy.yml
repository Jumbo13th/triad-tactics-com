name: Production deployment and setup

on:
  # Manual runs install/update host maintenance. CI calls this workflow to deploy.
  workflow_dispatch:
    inputs:
      adopt_revision:
        description: Verified deployed commit, only if the legacy image has no revision label
        type: string
        required: false
  workflow_call:
    inputs:
      revision:
        description: Commit that passed this CI run
        type: string
        required: true
      image_digest:
        description: Immutable digest of the image tested and published by CI
        type: string
        required: true

permissions:
  contents: read
  packages: read

concurrency:
  group: production-operations
  cancel-in-progress: false
  queue: max

jobs:
  production:
    if: >-
      github.repository == 'Jumbo13th/triad-tactics-com' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    steps:
    - name: Checkout reviewed revision
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        ref: ${{ inputs.revision || github.sha }}
        persist-credentials: false
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.13'
        cache: pip
        cache-dependency-path: ops/requirements.txt

    - name: Install Ansible
      run: |
        python -m pip install -r ops/requirements.txt
        ansible-galaxy collection install -r ops/ansible/requirements.yml

    - name: Set up production SSH
      uses: ./.github/actions/setup-vps-ssh
      with:
        host: ${{ vars.DEPLOY_HOST }}
        private-key: ${{ secrets.DEPLOY_SSH_KEY }}
        known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

    - name: Install and verify host maintenance
      if: github.event_name == 'workflow_dispatch'
      env:
        BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        ADOPT_REVISION: ${{ inputs.adopt_revision }}
      run: ansible-playbook -i ops/ansible/inventory.yml ops/ansible/bootstrap.yml

    - name: Back up and deploy the tested image
      if: github.event_name == 'push'
      env:
        REVISION: ${{ inputs.revision }}
        IMAGE_DIGEST: ${{ inputs.image_digest }}
        REGISTRY_USERNAME: ${{ github.actor }}
        REGISTRY_TOKEN: ${{ github.token }}
      run: ansible-playbook -i ops/ansible/inventory.yml ops/ansible/deploy.yml
