name: CI

on:
  pull_request:
  push:
    branches:
    - main
  schedule:
  - cron: '23 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc

    - name: Audit dependencies
      run: npm audit --audit-level=low

  lint-and-test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      STEAM_WEB_API_KEY: ${{ secrets.STEAM_WEB_API_KEY }}
      TEST_STEAMID64_OWNED: ${{ vars.TEST_STEAMID64_OWNED }}
      TEST_STEAMID64_NOT_OWNED: ${{ vars.TEST_STEAMID64_NOT_OWNED }}
      TEST_STEAMID64_PRIVATE: ${{ vars.TEST_STEAMID64_PRIVATE }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Lint (format check)
      run: npm run lint

    - name: Build
      env:
        NODE_ENV: production
      run: npm run build

    - name: Tests
      run: npm test

    - name: Canary email
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      env:
        NODE_ENV: production
        BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
        BREVO_SENDER_NAME: ${{ secrets.BREVO_SENDER_NAME }}
        CANARY_EMAIL_TO: ${{ secrets.CANARY_EMAIL_TO }}
      run: npm run canary:email
