name: CI

on:
  pull_request:
  push:
    branches:
    - main
  workflow_dispatch:
  schedule:
  - cron: '23 6 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A main run may already be deploying; let it finish before the next one starts.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version-file: .nvmrc

    - name: Audit dependencies
      run: |
        node --test scripts/checkRuntimeAlignment.test.mjs
        node scripts/checkRuntimeAlignment.mjs
        npm audit --audit-level=low

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.13'
        cache: pip
        cache-dependency-path: ops/requirements.txt

    - name: Install operations validation tools
      run: |
        python -m pip install -r ops/requirements.txt
        ansible-galaxy collection install -r ops/ansible/requirements.yml
        sudo bash ops/setup-restic.sh

    - name: Validate deployment and backup configuration
      run: |
        ansible-lint ops/ansible/bootstrap.yml ops/ansible/deploy.yml
        ansible-playbook --syntax-check -i ops/ansible/inventory.yml \
          ops/ansible/bootstrap.yml ops/ansible/deploy.yml
        shellcheck ops/setup-restic.sh ops/backup/*.sh
        # GitHub added concurrency.queue after actionlint 1.7.12 was released.
        go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 \
          -ignore 'unexpected key "queue" for "concurrency" section'

    - name: Verify SQLite snapshots and restic recovery with synthetic data
      run: |
        python3 -m unittest discover -s ops/backup -p test_sqlite_snapshot.py
        bash ops/backup/test-restic.sh

  lint-and-test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      STEAM_WEB_API_KEY: ${{ secrets.STEAM_WEB_API_KEY }}
      TEST_STEAMID64_OWNED: ${{ vars.TEST_STEAMID64_OWNED }}
      TEST_STEAMID64_NOT_OWNED: ${{ vars.TEST_STEAMID64_NOT_OWNED }}
      TEST_STEAMID64_PRIVATE: ${{ vars.TEST_STEAMID64_PRIVATE }}

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Setup Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Lint (format check)
      run: npm run lint

    - name: Tests
      run: npm test

    - name: Canary email
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      env:
        NODE_ENV: production
        BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
        BREVO_SENDER_NAME: ${{ secrets.BREVO_SENDER_NAME }}
        CANARY_EMAIL_TO: ${{ secrets.CANARY_EMAIL_TO }}
      run: npm run canary:email

  container-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.publish.outputs.image_digest }}
      revision: ${{ steps.publish.outputs.revision }}
    env:
      IMAGE: triad-tactics-app:${{ github.sha }}

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Build production image
      id: build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        load: true
        pull: true
        tags: ${{ env.IMAGE }}
        labels: |
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.source=https://github.com/Jumbo13th/triad-tactics-com
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Check production HTTP and SQLite without external network access
      run: |
        # These are dummy values. --network none also prevents outbound API/email calls.
        cat > "$RUNNER_TEMP/smoke.env" <<'ENV'
        STEAM_WEB_API_KEY=ci-placeholder
        ADMIN_STEAM_IDS=76561198000000000
        NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        BREVO_API_KEY=ci-placeholder
        BREVO_SENDER_EMAIL=ci@example.invalid
        BREVO_SENDER_NAME=CI
        DISCORD_TOKEN_ENCRYPTION_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        OUTBOX_CRON_SECRET=ci-placeholder
        GAMESERVER_API_SECRET=ci-placeholder
        DISCORD_CLIENT_ID=ci-placeholder
        DISCORD_CLIENT_SECRET=ci-placeholder
        DISCORD_BOT_TOKEN=ci-placeholder
        DISCORD_REDIRECT_URI=https://example.invalid/discord
        DISCORD_GUILD_ID=ci-placeholder
        DISCORD_CONFIRMED_ROLE_ID=ci-placeholder
        ENV
        docker run --detach --name triad-smoke --network none \
          --env-file "$RUNNER_TEMP/smoke.env" \
          --tmpfs /app/database:rw,uid=1001,gid=1001,mode=0700 "$IMAGE"
        docker exec triad-smoke node scripts/smokeContainer.mjs

    - name: Container logs and cleanup
      if: always()
      run: |
        if docker container inspect triad-smoke >/dev/null 2>&1; then
          docker logs --tail 150 triad-smoke
          docker rm --force triad-smoke
        fi

    - name: Install vulnerability scanner
      uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
      with:
        # renovate: datasource=github-releases depName=aquasecurity/trivy
        version: v0.76.1
        cache: true

    - name: Scan app, nginx and cron images
      run: |
        export TRIVY_CACHE_DIR="$RUNNER_TEMP/trivy-cache"
        mkdir -p "$RUNNER_TEMP/container-reports"
        docker compose config --no-interpolate --format json > "$RUNNER_TEMP/compose.json"
        nginx_image=$(jq -r '.services.nginx.image' "$RUNNER_TEMP/compose.json")
        cron_image=$(jq -r '.services.cron.image' "$RUNNER_TEMP/compose.json")
        docker pull "$nginx_image"
        # Test our exact TLS/proxy config with an ephemeral, self-signed CI certificate.
        certificate_dir="$RUNNER_TEMP/letsencrypt/live/triad-tactics.com"
        mkdir -p "$certificate_dir"
        openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
          -keyout "$certificate_dir/privkey.pem" -out "$certificate_dir/fullchain.pem" \
          -subj '/CN=triad-tactics.com' >/dev/null 2>&1
        docker run --rm --network none --add-host app:127.0.0.1 \
          --mount "type=bind,source=$GITHUB_WORKSPACE/nginx/default.conf,target=/etc/nginx/conf.d/default.conf,readonly" \
          --mount "type=bind,source=$RUNNER_TEMP/letsencrypt,target=/etc/letsencrypt,readonly" \
          "$nginx_image" nginx -t
        # Cron installs curl at startup. Include those packages in its scan too.
        docker build --pull --tag triad-cron-scan - <<DOCKERFILE
        FROM $cron_image
        RUN apk add --no-cache curl
        DOCKERFILE
        status=0
        images=("$IMAGE" "$nginx_image" triad-cron-scan)
        names=(app nginx cron)
        for index in "${!images[@]}"; do
          scan_image="${images[$index]}"
          report="$RUNNER_TEMP/container-reports/${names[$index]}.json"
          # Retain all findings, including vulnerabilities without an upstream fix.
          trivy image --scanners vuln --pkg-types os,library --severity HIGH,CRITICAL \
            --format json --output "$report" --timeout 10m "$scan_image"
          # Block releases on actionable findings; do not hide unfixed issues above.
          trivy image --scanners vuln --pkg-types os,library --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 --format table --timeout 10m "$scan_image" || status=1
          jq -r --arg image "$scan_image" \
            '"### " + $image, "All HIGH/CRITICAL findings (including unfixed): " + ([.Results[]?.Vulnerabilities[]?] | length | tostring)' \
            "$report" >> "$GITHUB_STEP_SUMMARY"
        done
        exit "$status"

    - name: Retain vulnerability reports
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: container-vulnerability-reports
        path: ${{ runner.temp }}/container-reports/*.json
        retention-days: 7
        if-no-files-found: ignore

    - name: Log in to GitHub Container Registry
      if: github.repository == 'Jumbo13th/triad-tactics-com' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Publish the exact tested image
      id: publish
      if: github.repository == 'Jumbo13th/triad-tactics-com' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      env:
        BUILT_IMAGE_ID: ${{ steps.build.outputs.imageid }}
      run: |
        test "$(docker image inspect "$IMAGE" --format '{{.Id}}')" = "$BUILT_IMAGE_ID"
        registry_image="ghcr.io/${GITHUB_REPOSITORY,,}"
        docker tag "$IMAGE" "$registry_image:sha-$GITHUB_SHA"
        docker push "$registry_image:sha-$GITHUB_SHA"
        reference=$(docker image inspect "$registry_image:sha-$GITHUB_SHA" --format '{{range .RepoDigests}}{{println .}}{{end}}' | grep -F "$registry_image@sha256:" | head -1)
        digest=${reference#*@}
        [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
        echo "image_digest=$digest" >> "$GITHUB_OUTPUT"
        echo "revision=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
        # Markdown backticks are literal formatting.
        # shellcheck disable=SC2016
        printf 'Tested production image: `%s@%s`\n' "$registry_image" "$digest" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: [dependency-audit, lint-and-test, container-validation]
    if: >-
      github.repository == 'Jumbo13th/triad-tactics-com' && github.event_name == 'push' &&
      github.ref == 'refs/heads/main' && vars.STANDARD_PIPELINE_ENABLED == 'true'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      revision: ${{ needs.container-validation.outputs.revision }}
      image_digest: ${{ needs.container-validation.outputs.image_digest }}
    secrets: inherit
