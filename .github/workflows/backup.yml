name: Offsite backup

on:
  schedule:
  - cron: '47 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Serialize backups and deployments; retain all queued production operations.
concurrency:
  group: production-operations
  cancel-in-progress: false
  queue: max

jobs:
  backup:
    if: >-
      github.repository == 'Jumbo13th/triad-tactics-com' && github.ref == 'refs/heads/main' &&
      (vars.STANDARD_PIPELINE_ENABLED == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    steps:
    - name: Checkout reviewed operations
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Install verified restic release
      run: sudo bash ops/setup-restic.sh

    - name: Connect to the pinned production host
      uses: ./.github/actions/setup-vps-ssh
      with:
        host: ${{ vars.DEPLOY_HOST }}
        known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        private-key: ${{ secrets.DEPLOY_SSH_KEY }}

    - name: Copy and verify a fresh encrypted backup
      env:
        BUNNY_STORAGE_ZONE: ${{ vars.BUNNY_STORAGE_ZONE || 'triad-tactics-com' }}
        BUNNY_STORAGE_ENDPOINT: ${{ vars.BUNNY_STORAGE_ENDPOINT || 'storage.bunnycdn.com' }}
        BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
        BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
      run: timeout 35m bash ops/backup/copy-offsite.sh
