# Reverse proxy for triad-tactics.com
# TLS via Let's Encrypt (certbot on the host, webroot mode).
# Expects mounts:
# - /etc/letsencrypt      (certificates, read-only)
# - /var/www/certbot      (ACME http-01 challenge webroot, read-only)

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

# HTTP -> HTTPS (+ ACME challenges for certbot renewals)
server {
  listen 80;
  server_name triad-tactics.com;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  server_name triad-tactics.com;

  ssl_certificate     /etc/letsencrypt/live/triad-tactics.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/triad-tactics.com/privkey.pem;

  # Reasonable modern defaults
  ssl_session_timeout 1d;
  ssl_session_cache shared:MozSSL:10m;
  ssl_session_tickets off;

  ssl_protocols TLSv1.2 TLSv1.3;

  # Security headers
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  # Keep CSP minimal to avoid breaking Next.js runtime while still adding protection.
  add_header Content-Security-Policy "base-uri 'self'; frame-ancestors 'none'; object-src 'none'" always;

  # Proxy settings
  client_max_body_size 2m;

  location / {
    proxy_pass http://app:3000;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
